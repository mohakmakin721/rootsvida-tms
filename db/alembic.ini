# Alembic configuration — single migration source of truth (Part 2 §2.1).
# The DB URL is injected at runtime from Settings.database_url (see env.py),
# so no credentials live in this file.
[alembic]
script_location = %(here)s
prepend_sys_path = .
version_locations = %(here)s/migrations/versions
path_separator = os
# sqlalchemy.url is intentionally omitted — env.py sets it from the environment.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
